<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boupetique</title>
    <!-- Conexión de BootStrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Conexión a CSS -->
    <link rel="stylesheet" href="styles.css">
    

</head>
<body>
    <!--! inicio del header nav-bar-->
    <header id="header">
        <!--? Navegación, elemento bootstrap navbar-->
        <nav id="nav" class="navbar navbar-expand-lgnav bar-dark bg-dark">
            <div class="container-fluid">
            <!--? Se creo un monograma con CSS mientras se crea el logo. -->
                <a id="logo-home" class="navbar-brand d-none d-lg-flex align-items-center gap-2" href="index.html">
                    <!--? Contenedor del Monograma: logo creado con css, a este div aplicamos estilo css-->
                    <div class="logo-badge bg-danger text-white fw-bold d-flex justify-content-center align-items-center rounded-2 shadow-sm"
                        style="width: 40px; height: 40px;">
                        Bp
                    </div>
                    <!--? Texto del Logo -->
                    <span class="fw-semibold fs-5 text-white">Boupetique</span>
                </a>
                <!--? LOGOTIPO SECUNDARIO: Solo aparece en pantallas pequeñas -->
                <div class="d-flex align-items-center gap-2 d-lg-none">
                    <a class="navbar-brand d-flex align-items-center m-0" href="index.html">
                        <div class="logo-badge bg-danger text-white fw-bold d-flex justify-content-center align-items-center rounded-2 shadow-sm"
                            style="width: 35px; height: 35px;">
                            BP
                        </div>
                    </a>
                    <!--? 2. El botón hamburguesa que despliega menú que aparece solo en pantallas pequeñas -->
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarScroll" aria-controls="navbarScroll" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
        </nav>
    </header>
    <!--!fin header-->







    <!-- Script de Javascript -->
    <script src="app.js"></script>
    <!-- Script de BootStrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
